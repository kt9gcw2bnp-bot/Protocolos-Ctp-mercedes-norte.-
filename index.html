<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plataforma oficial de protocolos y procedimientos institucionales del CTP Mercedes Norte, Heredia.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Protocolos CTP Mercedes Norte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: app de una columna. Inicio = mosaico de perfiles a color; protocolo = ruta vertical tipo red, fases en paralelo lado a lado, unidas por líneas gruesas */
:root{
  --bg:#eef2f6; --paper:#ffffff; --ink:#0f1b2d; --muted:#56637a; --line:#cfd8e3;
  --route:#0f1b2d; --stamp:#d1432f;
  --adm:#0b7a83; --doc:#4b4fd0; --est:#e0552f; --pad:#c98a00;
  --c:var(--adm);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b121d; --paper:#141e2c; --ink:#eaf0f7; --muted:#9aa8bc; --line:#2a384b;
  --route:#c7d3e2; --stamp:#ff7a63;
  --adm:#36b9c2; --doc:#8f93ff; --est:#ff8a63; --pad:#f0b938; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b121d; --paper:#141e2c; --ink:#eaf0f7; --muted:#9aa8bc; --line:#2a384b;
  --route:#c7d3e2; --stamp:#ff7a63;
  --adm:#36b9c2; --doc:#8f93ff; --est:#ff8a63; --pad:#f0b938; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}
svg.i{width:1em;height:1em;flex:none}

/* Encabezado */
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.top{gap:14px;padding-bottom:16px;border-bottom:2px solid var(--line)}
.crest{flex:none;width:72px;height:72px;border-radius:20px;background:#ffffff;display:grid;place-items:center;padding:6px;box-sizing:border-box;
  box-shadow:0 0 0 1px var(--line)}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.sm{width:52px;height:52px;border-radius:14px;padding:4px}
.top small{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.top b{display:block;font:800 clamp(22px,5.5vw,28px)/1.05 var(--display);letter-spacing:-.015em}
.top .loc{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.foot{display:flex;align-items:center;gap:12px;margin-top:40px;padding-top:16px;border-top:2px solid var(--line);font-size:13.5px;color:var(--muted)}
.foot p{margin:0}
.foot b{color:var(--ink)}
h1{font:800 clamp(32px,8vw,52px)/1 var(--display);letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
h1 em{font-style:normal;color:var(--c)}
.lead{color:var(--muted);margin:0 0 22px;font-size:18px;max-width:34em}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;font-size:15px}
.crumbs button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.crumbs button:hover{border-color:var(--c)}
.crumbs span{color:var(--muted)}

/* Perfiles */
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:170px;
  text-align:left;background:var(--c);color:#fff;border:0;border-radius:22px;padding:18px;transition:transform .2s}
.role:hover{transform:translateY(-3px) rotate(-.4deg)}
.role .big{position:absolute;right:-18px;bottom:-22px;width:120px;height:120px;opacity:.22}
.role .ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:26px}
.role b{font:800 clamp(20px,5vw,26px)/1.05 var(--display);letter-spacing:-.01em;display:block}
.role small{display:block;font-size:14px;opacity:.92}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .role{color:#0b121d}}
:root[data-theme="dark"] .role{color:#0b121d}

/* Lista */
.search{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);font:inherit;margin-bottom:14px}
.search:focus{border-color:var(--c);outline:none}
.list{display:flex;flex-direction:column;gap:12px}
.proto{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--paper);border:2px solid var(--line);
  border-radius:18px;padding:16px;transition:border-color .15s}
.proto:hover{border-color:var(--c)}
.proto .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.code{font:800 13px var(--display);letter-spacing:.04em;color:var(--c)}
.proto b{font:800 20px/1.2 var(--display);text-wrap:balance}
.dots{display:flex;align-items:center;gap:0}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.dots i.g{background:var(--stamp)}
.dots s{width:14px;height:3px;background:var(--line)}
.proto small{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:24px;text-align:center;border:2px dashed var(--line);border-radius:18px}

/* Ficha del protocolo */
.hero{background:var(--c);color:#fff;border-radius:26px;padding:22px 20px;position:relative;overflow:hidden}
.hero .code{color:inherit;opacity:.85}
.hero h2{font:800 clamp(26px,6.5vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance;max-width:16em}
.hero p{margin:0;max-width:32em;opacity:.95}
.hero .ring{position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{color:#0b121d}}
:root[data-theme="dark"] .hero{color:#0b121d}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0}
.fact{background:var(--paper);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.fact span{display:block;font-size:13px;color:var(--muted)}
.fact b{font:800 20px/1.2 var(--display)}
.info{display:grid;gap:8px;margin:14px 0 0;font-size:15px}
.info div{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.info svg{font-size:20px;color:var(--c);margin-top:1px}
.info b{display:block;font-size:13px;color:var(--muted);font-weight:400}

h3.sec{font:800 26px/1.1 var(--display);letter-spacing:-.015em;margin:34px 0 4px}
.sec-sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);margin-bottom:16px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.lg-node{width:16px;height:16px;border-radius:50%;background:var(--c)}
.etapa{display:block;margin:12px 14px -4px;font:800 11.5px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.stamp + .node-btn .etapa{margin-right:96px}
.fchips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 14px 14px;margin-top:-4px;font-size:13px;color:var(--muted)}
.fchips a{font:800 13px var(--display);color:var(--c);background:var(--bg);border:1.5px solid var(--c);border-radius:8px;padding:3px 9px;text-decoration:none}
.fchips a:hover{background:var(--c);color:#fff}
.guia{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g-et{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.g-h{display:flex;align-items:center;gap:8px}
.g-h b{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 14px var(--display);flex:none}
.g-h span{font:800 14.5px/1.15 var(--display)}
.g-f{display:flex;gap:8px;align-items:flex-start;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.3;padding:6px;border-radius:10px;background:var(--bg)}
.g-f:hover{outline:2px solid var(--c)}
.g-f em{font:800 13px var(--display);font-style:normal;color:var(--c);white-space:nowrap}
@media (max-width:760px){.guia{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.guia{grid-template-columns:1fr}}
.lg-sos{background:var(--stamp)!important}
.node.sos{border-color:var(--stamp);background:linear-gradient(var(--paper),var(--paper)) padding-box}
.node.sos .badge{background:var(--stamp)}
.node.sos .n-title{color:var(--stamp)}
.node.sos .time svg,.node.sos .more h4{color:var(--stamp)}
.node.sos .cta{background:var(--stamp)}
.lg-stamp{border:2px dashed var(--stamp);color:var(--stamp);font-weight:700;font-size:11px;padding:0 6px;border-radius:4px;transform:rotate(-4deg)}

/* Ruta (diagrama de red vertical) */
.route{display:flex;flex-direction:column;align-items:stretch}
.term{align-self:center;display:flex;align-items:center;gap:10px;background:var(--route);color:var(--bg);
  border-radius:999px;padding:10px 20px 10px 10px;max-width:100%;box-sizing:border-box}
.term i{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-style:normal;flex:none;color:#fff}
.term span{font-size:15px;line-height:1.25}
.term b{display:block;font:800 13px var(--display);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.conn{display:block;width:100%;height:44px;overflow:visible}
.conn path{fill:none;stroke:var(--route);stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.level{display:grid;gap:12px;align-items:start}
.level.n1{grid-template-columns:minmax(0,440px);justify-content:center}
.node{position:relative;background:var(--paper);border:2.5px solid var(--route);border-radius:22px;
  display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.node-btn{background:none;border:0;padding:0;text-align:left;width:100%;display:flex;flex-direction:column;border-radius:20px}
.node::before{content:"";position:absolute;top:-11px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:var(--route)}
.node:hover{transform:translateY(-2px);box-shadow:0 8px 0 -2px var(--c)}
.node.open{box-shadow:0 8px 0 -2px var(--c)}
.n-head{display:flex;gap:12px;align-items:center;padding:14px 14px 10px}
.badge{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;font-size:22px;position:relative}
.badge em{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--route);color:var(--bg);
  font:800 12px/22px var(--display);font-style:normal;text-align:center}
.n-title{font:800 18px/1.15 var(--display);letter-spacing:-.005em;text-wrap:balance;min-width:0}
.time{margin:0 14px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;font-size:16px}
.time svg{color:var(--c);font-size:20px}
.who{display:flex;align-items:center;gap:8px;padding:10px 14px 14px;font-size:15px;color:var(--muted)}
.who svg{font-size:18px}
.who b{color:var(--ink);font-weight:700}
.stamp{position:absolute;top:10px;right:10px;border:2px dashed var(--stamp);color:var(--stamp);border-radius:8px;padding:3px 7px;
  font:800 10.5px/1.15 var(--display);letter-spacing:.05em;text-transform:uppercase;text-align:center;transform:rotate(6deg);background:var(--paper)}
.stamp + .node-btn .n-head{padding-right:96px}
.more{border-top:2px dashed var(--line);padding:12px 14px 14px;font-size:15px}
.more h4{margin:0 0 4px;font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.more ul{margin:0 0 10px;padding-left:20px}
.more li{margin:3px 0}
.docs{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.docrow{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:7px 10px;font-size:14.5px}
.docrow svg{color:var(--c);font-size:17px}
.docrow span{flex:1;min-width:0}
.mini{font-weight:700;color:var(--c);text-decoration:none;border:1.5px solid var(--c);border-radius:999px;padding:2px 10px;font-size:13px}
.close{background:none;border:0;padding:4px 0;color:var(--muted);font-size:13.5px;font-weight:700}
.res{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);
  border:2px solid var(--line);border-radius:18px;padding:14px}
.r-ico{width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:24px}
.r-txt{display:flex;flex-direction:column;gap:2px}
.r-txt b{font:800 17px/1.2 var(--display)}
.r-txt>span{font-size:14.5px;color:var(--muted)}
.r-txt small{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink);margin-top:4px}
.r-go{display:inline-flex;align-items:center;gap:6px;background:var(--route);color:var(--bg);text-decoration:none;font-weight:700;
  border-radius:999px;padding:10px 16px;white-space:nowrap}
.r-pend{font-size:13px;font-weight:700;color:var(--muted);border:2px dashed var(--line);border-radius:999px;padding:8px 12px;white-space:nowrap}
.tap{padding:0 14px 14px;margin-top:-4px;display:flex}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;font:700 15px var(--body);
  border-radius:999px;padding:9px 16px;white-space:nowrap;transition:gap .15s}
.cta.sm{font-size:14px;padding:7px 14px;white-space:normal}
.cta-w{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:#fff;color:var(--c);font:700 15px var(--body);
  border-radius:999px;padding:8px 16px;transition:gap .15s}
.arr{font-weight:800;transition:transform .15s}
.proto:hover .arr,.role:hover .arr,.node-btn:hover .arr{transform:translateX(3px)}
.node-btn:hover .tap .arr{transform:translateY(3px)}
.proto:focus-visible .cta,.role:focus-visible .cta-w{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--c)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta{color:#0b121d}:root:not([data-theme="light"]) .cta-w{background:#0b121d}}
:root[data-theme="dark"] .cta{color:#0b121d}
:root[data-theme="dark"] .cta-w{background:#0b121d}
.conds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cond{background:var(--paper);border:2px solid var(--c);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cond b{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 16px var(--display)}
.cond span{font:700 16px/1.2 var(--display)}
.alert{margin-top:16px;background:var(--paper);border:2px solid var(--stamp);border-radius:18px;padding:14px 16px}
.alert h4{margin:0 0 6px;display:flex;align-items:center;gap:8px;color:var(--stamp);font:800 17px var(--display)}
.alert h4 svg{font-size:22px}
.alert ul{margin:0;padding-left:20px;font-size:15.5px}
.alert li{margin:4px 0}
.note a{color:var(--c);font-weight:700}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.eyebrow svg{font-size:18px}
.proto .desc{color:var(--muted);font-size:14.5px;line-height:1.4}
.areas{display:grid;gap:12px}
.area{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--paper);
  border:2px solid var(--line);border-radius:20px;padding:16px;transition:border-color .15s,transform .15s}
.area:hover{border-color:var(--c);transform:translateY(-2px)}
.a-ico{width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:26px}
.a-txt b{display:block;font:800 18px/1.2 var(--display);text-wrap:balance}
.a-txt small{color:var(--muted);font-size:14px}
.a-n{display:flex;flex-direction:column;align-items:center;font:800 26px/1 var(--display);color:var(--c)}
.a-n small{font:400 11px var(--body);color:var(--muted);margin-top:2px}
.always{display:grid;gap:12px}
.dir{background:var(--paper);border:2px solid var(--stamp);border-radius:20px;padding:16px}
.dir h4{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:800 17px var(--display);color:var(--stamp)}
.dir h4 svg{font-size:22px}
.d911{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--stamp);color:#fff;border-radius:14px;padding:10px 16px;margin-bottom:10px}
.d911 b{font:800 30px/1 var(--display);letter-spacing:.02em;user-select:all}
.dir dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
.dir dl div{border-bottom:1px dashed var(--line);padding:5px 0}
.dir dt{font-size:13px;color:var(--muted)}
.dir dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;user-select:all}
.norma{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);border:2px solid var(--line);
  border-radius:18px;padding:14px;color:var(--ink);text-decoration:none}
.norma:hover{border-color:var(--c)}
.norma b{display:block;font:800 17px/1.2 var(--display)}
.norma small{color:var(--muted);font-size:14px}
.norma .arr{font-size:20px;color:var(--c)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .a-ico,:root:not([data-theme="light"]) .d911{color:#0b121d}}
:root[data-theme="dark"] .a-ico,:root[data-theme="dark"] .d911{color:#0b121d}
@media (max-width:520px){.dir dl{grid-template-columns:1fr}}
.note{margin-top:26px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

@media (max-width:620px){.conds{grid-template-columns:1fr 1fr}}
@media (max-width:520px){
  .rcard{grid-template-columns:auto minmax(0,1fr)}
  .r-go,.r-pend{grid-column:1/-1;justify-content:center;text-align:center}
  .facts{grid-template-columns:1fr 1fr}
  .facts .fact:last-child{grid-column:1/-1}
  .n-head{flex-direction:column;align-items:flex-start;gap:8px}
  .level:not(.n1) .stamp{position:static;align-self:flex-start;margin:12px 0 0 12px;transform:rotate(-3deg)}
  .level:not(.n1) .stamp + .node-btn .n-head{padding-right:14px}
  .level:not(.n1) .n-title{font-size:16px}
  .level:not(.n1) .time{font-size:14px;padding:6px 9px}
  .level:not(.n1) .who{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>

/* ===== NIVELES DEL DIAGRAMA ===== */
function niveles(fases){
  const by=Object.fromEntries(fases.map(f=>[f.id,{...f,succ:[]}]));
  fases.forEach(f=>f.predecesoras.forEach(p=>by[p]&&by[p].succ.push(f.id)));
  const lvl=id=>by[id].nivel??(by[id].nivel=by[id].predecesoras.length?Math.max(...by[id].predecesoras.map(lvl))+1:0);
  fases.forEach(f=>lvl(f.id));
  const rows=[];Object.values(by).forEach(n=>(rows[n.nivel]=rows[n.nivel]||[]).push(n));
  return {rows,by};
}

/* Conector entre dos niveles */
function conector(up,down){
  const x=(i,n)=>n===1?50:(i+.5)/n*100;
  let d="";
  down.forEach((n,j)=>{
    const preds=up===null?[null]:n.predecesoras.map(p=>up.findIndex(u=>u.id===p)).filter(i=>i>=0);
    preds.forEach(i=>{const x1=up===null?50:x(i,up.length),x2=x(j,down.length);d+=`M${x1},0 C${x1},22 ${x2},22 ${x2},40 `;});
  });
  return `<svg class="conn" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="${d}"/></svg>`;
}
function conectorFin(up){
  const d=up.filter(n=>!n.succ.length).map(n=>{const i=up.indexOf(n),x1=up.length===1?50:(i+.5)/up.length*100;return `M${x1},0 C${x1},22 50,22 50,40`}).join(" ");
  return `<svg class="conn" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="${d}"/></svg>`;
}

      <div class="fact"><span>Área</span><b>${esc(areaDe(p.area).corto)}</b></div>
    </div>
    ${p.condiciones?.length?`<h3 class="sec">¿Cuándo aplica?</h3><p class="sec-sub">Deben cumplirse las ${p.condiciones.length} condiciones.</p>
      <div class="conds">${p.condiciones.map((c,i)=>`<div class="cond"><b>${i+1}</b><span>${esc(c)}</span></div>`).join("")}</div>`:""}
    ${p.alertas?.length?`<div class="alert"><h4>${svg("alerta")} Importante</h4><ul>${p.alertas.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`:""}
    <div class="info">
      ${p.encargada?`<div>${svg("persona")}<span><b>Persona encargada</b>${esc(p.encargada)}</span></div>`:p.responsableGeneral?`<div>${svg("persona")}<span><b>Responsables</b>${esc(p.responsableGeneral)}</span></div>`:""}
      ${p.canales?`<div>${svg("telefono")}<span><b>Canales oficiales</b>${esc(p.canales)}</span></div>`:""}
      <div>${svg("libro")}<span><b>Normativa</b>${esc(p.normativa)}</span></div>
    </div>

    ${recursos(p)}
    ${p.pauta||p.atencion?guia(p.pauta):""}
    <h3 class="sec">Ruta del procedimiento</h3>
    <p class="sec-sub">Las fases lado a lado se hacen al mismo tiempo.</p>
    <div class="legend"><span><i class="lg-node"></i>Fase</span><span><i class="lg-stamp">Aprueba</i>Requiere aprobación</span>${p.fases.some(f=>f.emergencia)?`<span><i class="lg-node lg-sos"></i>Llamada al 911</span>`:""}</div>
    <div class="route">${ruta}</div>
    ${p.area==="riesgo"?siempre():""}
    <p class="note">${p.fuente?`<a href="${esc(p.fuente)}" target="_blank" rel="noopener">Ver el documento original</a>`:""}${p.fases.some(f=>/sin plazo/i.test(f.plazo))?" · Donde dice “sin plazo fijo”, el documento no establece un tiempo numérico; se actúa con prontitud.":""}</p>`;
}

function render(){renderCrumbs();if(!state.perfil)renderHome();else if(state.proto!==null)renderProto();else if(state.area)renderLista();else renderAreas();}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-perfil],[data-area],[data-proto],[data-go],[data-node]");if(!t)return;
  if(t.dataset.perfil)go({perfil:t.dataset.perfil,area:null,proto:null,q:""});
  else if(t.dataset.area)go({area:t.dataset.area,proto:null});
  else if(t.dataset.proto!==undefined)go({proto:+t.dataset.proto,area:PROTOCOLOS[+t.dataset.proto].area,open:{}});
  else if(t.dataset.go==="home")go({perfil:null,area:null,proto:null,q:""});
  else if(t.dataset.go==="perfil")go({area:null,proto:null});
  else if(t.dataset.go==="area")go({proto:null});
  else if(t.dataset.node){const id=t.dataset.node;state.open[id]=!state.open[id];
    const y=window.scrollY;renderProto();window.scrollTo({top:y});
    const nb=document.querySelector(`[data-node="${id}"]`);nb&&nb.focus({preventScroll:true});}
});
render();
</script>

</body>
</html>
